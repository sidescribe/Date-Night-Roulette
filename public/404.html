<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Date Night Roulette</title>
    <script>
      // GitHub Pages: serve the SPA for any 404 so client-side routing works
      var path = window.location.pathname.replace(/\/Date-Night-Roulette\/?/, '/Date-Night-Roulette/');
      if (path !== '/Date-Night-Roulette/') {
        window.location.replace('/Date-Night-Roulette/' + (window.location.search || '') + (window.location.hash || ''));
      } else {
        window.location.reload();
      }
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/Date-Night-Roulette/">Date Night Roulette</a>…</p>
  </body>
</html>
